name: Publish merged packages

# On every push to master: for each package directory the push touched, and
# each channel it is eligible for, find the PR build artifact for exactly
# that tree (label = <pkg>-<mirror>-<arch>-<treehash>), or build it now when
# there is none, then publish it incrementally into the channel.
#
# Secrets live in the "publish" environment, restricted to master:
#   GPG_PRIVATE_KEY, GPG_PASSPHRASE   the channel signing key
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT
# OMARCHY_PUBLISH_PREFIX (environment variable, not secret) points a proof
# run at a scratch prefix inside the live bucket; empty means the real
# channel paths.

on:
  push:
    branches: [master]
    paths: ["pkgbuilds/**"]
  workflow_dispatch:
    inputs:
      packages:
        description: "Space-separated package directories to publish from master"
        required: true

# Merges serialize. Two publishes into one channel at once would race on
# the database; queued is fine, cancelled is not.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: list
        run: |
          if [[ -n "${{ github.event.inputs.packages }}" ]]; then
            names="${{ github.event.inputs.packages }}"
          else
            names=$(git diff --name-only "${{ github.event.before }}..${{ github.sha }}" -- pkgbuilds \
              | awk -F/ '$1=="pkgbuilds" && NF>2 {print $2}' | sort -u)
          fi
          matrix=$(printf '%s\n' $names | bin/build-matrix)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.include | length' <<<"$matrix")" >> "$GITHUB_OUTPUT"
          jq -r '.include[] | "\(.package) -> \(.mirror)/\(.arch)"' <<<"$matrix"

  publish:
    needs: changes
    if: needs.changes.outputs.count != '0'
    runs-on: [self-hosted, omarchy-builder]
    environment: publish
    timeout-minutes: 240
    strategy:
      # One channel at a time per job is what publish-artifact assumes; the
      # matrix runs channels in parallel because each is its own database.
      max-parallel: 3
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Find the PR build for this tree
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hash=$(git rev-parse HEAD:pkgbuilds/${{ matrix.package }})
          label="${{ matrix.package }}-${{ matrix.mirror }}-${{ matrix.arch }}-$hash"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          # Newest non-expired artifact with that exact label, from any run
          # of the PR workflow in this repository (never a fork's).
          id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=$label&per_page=5" \
            --jq '[.artifacts[] | select(.expired|not)] | sort_by(.created_at) | last | .id // empty')
          echo "artifact_id=$id" >> "$GITHUB_OUTPUT"
          echo "${id:+found artifact $id for }$label${id:+ }${id:-: no artifact, will build}"

      - name: Download the PR build
        if: steps.find.outputs.artifact_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.find.outputs.label }}
          path: build-output/${{ matrix.mirror }}/${{ matrix.arch }}

      - name: Build (no PR artifact for this tree)
        if: steps.find.outputs.artifact_id == ''
        env:
          CONTAINER_ENGINE: docker
        run: bin/build --mirror ${{ matrix.mirror }} --arch ${{ matrix.arch }} --package ${{ matrix.package }}

      - name: Publish to ${{ matrix.mirror }}/${{ matrix.arch }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          OMARCHY_PUBLISH_PREFIX: ${{ vars.OMARCHY_PUBLISH_PREFIX }}
        # repo-add, gpg and bsdtar are Arch tools; run the publish inside the
        # builder image (host-native, edge) with the workspace mounted, the
        # same way bin/sign and bin/update-repo already do.
        run: |
          shopt -s nullglob
          files=(build-output/${{ matrix.mirror }}/${{ matrix.arch }}/*.pkg.tar.zst)
          (( ${#files[@]} )) || { echo "no package files to publish" >&2; exit 1; }
          docker image inspect omarchy-pkg-builder:latest-x86_64-edge >/dev/null 2>&1 \
            || docker buildx build --load -t omarchy-pkg-builder:latest-x86_64-edge --build-arg MIRROR=edge build
          docker run --rm \
            -e GPG_PRIVATE_KEY -e GPG_PASSPHRASE -e OMARCHY_PUBLISH_PREFIX \
            -e RCLONE_CONFIG_R2_TYPE -e RCLONE_CONFIG_R2_PROVIDER -e RCLONE_CONFIG_R2_ENDPOINT \
            -e RCLONE_CONFIG_R2_ACCESS_KEY_ID -e RCLONE_CONFIG_R2_SECRET_ACCESS_KEY \
            -v "$PWD:/w:ro" -w /w \
            omarchy-pkg-builder:latest-x86_64-edge \
            bin/publish-artifact --remote R2:omarchy-pkgs --mirror ${{ matrix.mirror }} --arch ${{ matrix.arch }} "${files[@]}"

  result:
    needs: [changes, publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "publish result: ${{ needs.publish.result }}"
          [[ "${{ needs.publish.result }}" == "success" || "${{ needs.publish.result }}" == "skipped" ]]
